# Every check runs against the same native-protocol server revision.
name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: windows-latest
            exe: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TURBORELD: ${{ github.workspace }}/.upstream/target/debug/turboreld${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - uses: actions/checkout@v7
        with:
          repository: turborel/turborel
          ref: 3f25a033dad94814fbd4e7d871e48eb81b2734cc
          path: .upstream
      - name: Install the pinned server toolchain
        working-directory: .upstream
        run: rustup toolchain install
      - name: Build the reference server
        working-directory: .upstream
        run: cargo build --locked -p turboreld
      - name: Install static analysis
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Check module files
        run: go mod tidy
      - name: Refuse module drift
        run: git diff --exit-code -- go.mod go.sum
      - name: Every check and coverage
        run: go run ./cmd/verify -coverage
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check reachable vulnerabilities
        run: govulncheck ./...
