version: "2"
run:
  timeout: 5m
  build-tags: [integration]
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: []
formatters:
  enable: [gofmt]
